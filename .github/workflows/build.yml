name: Build

on:
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      packages: write
      contents: write

    steps:
      -
        name: Set version
        run: |
          #!/usr/bin/env bash
          set -Eeuo pipefail

          version="${{ vars.MAJOR }}.${{ vars.MINOR }}"

          if [ -z "${{ vars.MAJOR }}" ] || [ -z "${{ vars.MINOR }}" ]; then
            echo "ERROR: MAJOR and MINOR repository variables must be set." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_ENV"
          echo "Building version: $version"

      -
        name: Check if the tag exists locally
        uses: action-pack/tag-exists@v1
        id: checkTag
        with:
          tag: 'v${{ env.version }}'

      -
        name: Finish when found
        run: |
          #!/usr/bin/env bash
          set -Eeuo pipefail

          echo "exists=${{ steps.checkTag.outputs.exists }}" >> "$GITHUB_ENV"

      -
        name: Checkout
        if: env.exists == 'false'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      -
        name: Resolve module commit
        if: env.exists == 'false'
        id: module
        run: |
          #!/usr/bin/env bash
          set -Eeuo pipefail

          module_commit=$(
            git ls-remote \
              "https://github.com/${GITHUB_REPOSITORY}.git" \
              refs/heads/module \
              | awk 'NR == 1 { print $1 }'
          )

          if [ -z "$module_commit" ]; then
            echo "ERROR: The module branch was not found." >&2
            exit 1
          fi

          echo "commit=$module_commit" >> "$GITHUB_OUTPUT"
          echo "Using module commit: $module_commit"

      -
        name: Lint Dockerfile
        if: env.exists == 'false'
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008,DL3059,DL3018
          failure-threshold: warning

      -
        name: Docker metadata
        id: meta
        if: env.exists == 'false'
        uses: docker/metadata-action@v6
        with:
          context: git
          images: |
            ${{ secrets.DOCKERHUB_REPO }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,priority=100
            type=raw,value=${{ vars.MAJOR }}.${{ vars.MINOR }}
          labels: |
            org.opencontainers.image.title=${{ vars.NAME }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      -
        name: Set up Docker Buildx
        if: env.exists == 'false'
        uses: docker/setup-buildx-action@v4

      -
        name: Build binaries
        if: env.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          provenance: false
          outputs: type=local,dest=output
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            MODULE_COMMIT=${{ steps.module.outputs.commit }}

      -
        name: Rename binaries
        if: env.exists == 'false'
        run: |
          #!/usr/bin/env bash
          set -Eeuo pipefail

          mv \
            output/linux_amd64/utk.bin \
            "output/utk_${{ steps.meta.outputs.version }}_amd64.bin"

          mv \
            output/linux_arm64/utk.bin \
            "output/utk_${{ steps.meta.outputs.version }}_arm64.bin"

          rm -rf \
            output/linux_amd64 \
            output/linux_arm64

      -
        name: Create a release
        if: env.exists == 'false'
        uses: action-pack/github-release@v2
        with:
          tag: "v${{ steps.meta.outputs.version }}"
          title: "v${{ steps.meta.outputs.version }}"
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      -
        name: Add assets to release
        if: env.exists == 'false'
        uses: AButler/upload-release-assets@v4.0
        with:
          files: 'output/*'
          release-tag: "v${{ steps.meta.outputs.version }}"
          repo-token: ${{ secrets.REPO_ACCESS_TOKEN }}

      -
        name: Increment version variable
        if: env.exists == 'false'
        uses: action-pack/bump@v2
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      -
        name: Send mail
        if: env.exists == 'false'
        uses: action-pack/send-mail@v1
        with:
          to: ${{ secrets.MAILTO }}
          from: Github Actions <${{ secrets.MAILTO }}>
          connection_url: ${{ secrets.MAIL_CONNECTION }}
          subject: Build of ${{ github.event.repository.name }} v${{ steps.meta.outputs.version }} completed
          body: |
            The build job of ${{ github.event.repository.name }} v${{ steps.meta.outputs.version }} was completed successfully!

            See https://github.com/${{ github.repository }}/actions for more information.
