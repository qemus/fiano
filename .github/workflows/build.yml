name: Build

on:
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare module
    runs-on: ubuntu-latest
    permissions:
      actions: write
      packages: write
      contents: write
    env:
      FIANO_VERSION: "1.2.0"
      FIANO_COMMIT: "02de48cf93e8d924131246b1fa744b63b37f9aa6"

    outputs:
      exists: ${{ steps.checkTag.outputs.exists }}
      version: ${{ steps.version.outputs.version }}
      module_tag: ${{ steps.version.outputs.module_tag }}
      upstream_commit: ${{ steps.module.outputs.upstream_commit }}
      module_commit: ${{ steps.module.outputs.commit }}

    steps:
      -
        name: Set version
        id: version
        run: |
          #!/usr/bin/env bash
          set -Eeuo pipefail

          minor="${{ vars.MINOR }}"
          minor="${minor#0}"
          version="1.${{ vars.MAJOR }}.${minor:-0}"

          if [ -z "${{ vars.MAJOR }}" ] || [ -z "${{ vars.MINOR }}" ]; then
            echo "ERROR: MAJOR and MINOR repository variables must be set." >&2
            exit 1
          fi

          if [[ ! "${{ vars.MODULE }}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: MODULE repository variable must be a non-negative integer." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "module_tag=v${version}-${{ vars.MODULE }}" >> "$GITHUB_OUTPUT"
          echo "Building version: $version"

      -
        name: Check if the tag exists locally
        uses: action-pack/tag-exists@v1
        id: checkTag
        with:
          tag: '${{ steps.version.outputs.version }}'

      -
        name: Checkout
        if: steps.checkTag.outputs.exists == 'false'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      -
        name: Check module tag
        if: steps.checkTag.outputs.exists == 'false'
        env:
          MODULE_TAG: ${{ steps.version.outputs.module_tag }}
        run: |
          #!/usr/bin/env bash
          set -Eeuo pipefail

          if git ls-remote \
            --exit-code \
            --tags \
            origin \
            "refs/tags/${MODULE_TAG}" \
            >/dev/null 2>&1; then
            echo "ERROR: Tag ${MODULE_TAG} already exists." >&2
            exit 1
          fi

      -
        name: Set up Go
        if: steps.checkTag.outputs.exists == 'false'
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.7"
          cache: false

      -
        name: Generate module
        if: steps.checkTag.outputs.exists == 'false'
        id: module
        run: |
          #!/usr/bin/env bash
          set -Eeuo pipefail

          module_dir="$RUNNER_TEMP/fiano-module"

          old_upstream=$(
            git ls-remote \
              origin \
              refs/heads/upstream \
              | awk 'NR == 1 { print $1 }'
          )

          old_module=$(
            git ls-remote \
              origin \
              refs/heads/module \
              | awk 'NR == 1 { print $1 }'
          )

          git remote add fiano https://github.com/linuxboot/fiano.git
          git fetch \
            --no-tags \
            fiano \
            "refs/tags/v${FIANO_VERSION}:refs/remotes/fiano/v${FIANO_VERSION}"

          fiano_commit="$(git rev-parse "refs/remotes/fiano/v${FIANO_VERSION}^{commit}")"

          if [ "$fiano_commit" != "$FIANO_COMMIT" ]; then
            echo "ERROR: Fiano v${FIANO_VERSION} resolved to ${fiano_commit}, expected ${FIANO_COMMIT}." >&2
            exit 1
          fi

          rm -rf "$module_dir"
          git worktree add --detach "$module_dir" "$FIANO_COMMIT"

          git -C "$module_dir" config user.name "github-actions[bot]"
          git -C "$module_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git -C "$module_dir" apply --check "$GITHUB_WORKSPACE/patches/lzma-level.patch"
          git -C "$module_dir" apply "$GITHUB_WORKSPACE/patches/lzma-level.patch"
          git -C "$module_dir" add -A
          git -C "$module_dir" diff --cached --check
          git -C "$module_dir" commit -m "feat: Add configurable LZMA compression level"

          git -C "$module_dir" apply --check "$GITHUB_WORKSPACE/patches/preserve-unchanged.patch"
          git -C "$module_dir" apply "$GITHUB_WORKSPACE/patches/preserve-unchanged.patch"
          git -C "$module_dir" add -A
          git -C "$module_dir" diff --cached --check
          git -C "$module_dir" commit -m "fix: Preserve unchanged firmware and regenerate FV padding"

          git -C "$module_dir" apply --check "$GITHUB_WORKSPACE/patches/tests.patch"
          git -C "$module_dir" apply "$GITHUB_WORKSPACE/patches/tests.patch"
          git -C "$module_dir" add -A
          git -C "$module_dir" diff --cached --check
          git -C "$module_dir" commit -m "test: Add regression coverage for LZMA and FV padding"

          module_commit="$(git -C "$module_dir" rev-parse HEAD)"

          if [ "$(git -C "$module_dir" rev-list --count "${FIANO_COMMIT}..HEAD")" -ne 3 ]; then
            echo "ERROR: Generated module does not contain exactly three patch commits." >&2
            exit 1
          fi

          if [ -n "$(git -C "$module_dir" status --porcelain)" ]; then
            echo "ERROR: Generated module worktree is not clean." >&2
            exit 1
          fi

          git branch -f upstream "$FIANO_COMMIT"
          git branch -f module "$module_commit"

          echo "commit=$module_commit" >> "$GITHUB_OUTPUT"
          echo "upstream_commit=$FIANO_COMMIT" >> "$GITHUB_OUTPUT"
          echo "old_upstream=$old_upstream" >> "$GITHUB_OUTPUT"
          echo "old_module=$old_module" >> "$GITHUB_OUTPUT"

          echo "Using Fiano commit: $FIANO_COMMIT"
          echo "Generated module commit: $module_commit"

      -
        name: Test module
        if: steps.checkTag.outputs.exists == 'false'
        working-directory: ${{ runner.temp }}/fiano-module
        run: |
          #!/usr/bin/env bash
          set -Eeuo pipefail

          go test ./...

      -
        name: Publish module branches
        if: steps.checkTag.outputs.exists == 'false'
        env:
          OLD_UPSTREAM: ${{ steps.module.outputs.old_upstream }}
          OLD_MODULE: ${{ steps.module.outputs.old_module }}
        run: |
          #!/usr/bin/env bash
          set -Eeuo pipefail

          git push \
            --atomic \
            --force-with-lease="refs/heads/upstream:${OLD_UPSTREAM}" \
            --force-with-lease="refs/heads/module:${OLD_MODULE}" \
            origin \
            refs/heads/upstream:refs/heads/upstream \
            refs/heads/module:refs/heads/module

  regression:
    name: Regression test
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    uses: ./.github/workflows/test.yml
    with:
      upstream_commit: ${{ needs.prepare.outputs.upstream_commit }}
      module_commit: ${{ needs.prepare.outputs.module_commit }}
      runs: "10"
      boot_test: true

  build:
    name: Build and release
    needs:
      - prepare
      - regression
    if: needs.prepare.outputs.exists == 'false' && needs.regression.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      packages: write
      contents: write
    env:
      version: ${{ needs.prepare.outputs.version }}
      module_tag: ${{ needs.prepare.outputs.module_tag }}
      MODULE_COMMIT: ${{ needs.prepare.outputs.module_commit }}

    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      -
        name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          context: git
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,priority=100
            type=raw,value=${{ env.version }}
          labels: |
            org.opencontainers.image.title=${{ vars.NAME }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      -
        name: Build binaries
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          provenance: false
          outputs: type=local,dest=output
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            MODULE_COMMIT=${{ env.MODULE_COMMIT }}

      -
        name: Rename binaries
        run: |
          #!/usr/bin/env bash
          set -Eeuo pipefail

          mv output/linux_amd64/utk.bin "output/utk_amd64.bin"
          mv output/linux_arm64/utk.bin "output/utk_arm64.bin"

          rm -rf output/linux_amd64 output/linux_arm64

      -
        name: Create release tags
        run: |
          #!/usr/bin/env bash
          set -Eeuo pipefail

          master_commit="$(git rev-parse HEAD)"

          git tag "$version" "$master_commit"
          git tag "$module_tag" "$MODULE_COMMIT"

          git push \
            --atomic \
            origin \
            "refs/tags/${version}" \
            "refs/tags/${module_tag}"

          echo "Created master tag ${version} for ${master_commit}."
          echo "Created module tag ${module_tag} for ${MODULE_COMMIT}."

      -
        name: Increment module version
        uses: action-pack/increment@v2
        with:
          name: MODULE
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      -
        name: Create a release
        uses: action-pack/github-release@v2
        with:
          tag: "${{ env.version }}"
          title: "v${{ env.version }}"
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      -
        name: Add assets to release
        uses: AButler/upload-release-assets@v4.0
        with:
          files: 'output/*'
          release-tag: "${{ env.version }}"
          repo-token: ${{ secrets.REPO_ACCESS_TOKEN }}

      -
        name: Increment version variable
        if: false
        uses: action-pack/increment@v2
        with:
          name: 'MAJOR'
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      -
        name: Send mail
        uses: action-pack/send-mail@v1
        with:
          to: ${{ secrets.MAILTO }}
          from: Github Actions <${{ secrets.MAILTO }}>
          connection_url: ${{ secrets.MAIL_CONNECTION }}
          subject: Build of ${{ github.event.repository.name }} v${{ env.version }} completed
          body: |
            The build job of ${{ github.event.repository.name }} v${{ env.version }} was completed successfully!

            See https://github.com/${{ github.repository }}/actions for more information.
