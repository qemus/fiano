name: Update boot-logo

on:
  push:
    branches:
      - module

jobs:
  dispatch:
    name: Update boot-logo dependency
    runs-on: ubuntu-latest

    steps:
      -
        name: Dispatch boot-logo update
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
        run: |
          #!/usr/bin/env bash
          set -Eeuo pipefail

          response=$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/qemus/boot-logo/dispatches \
              --data '{"event_type":"fiano-module-updated"}'
          )

          if [ -n "$response" ]; then
            printf '%s\n' "$response"
          fi
