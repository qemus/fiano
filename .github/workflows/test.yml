          func TestWorkflowCLITightenME(
          	t *testing.T,
          ) {
          	root, meRegion, biosRegion :=
          		workflowTightenMEFixture(t)

          	oldMELimit := meRegion.FRegion.Limit
          	oldBIOSBase := biosRegion.FRegion.Base
          	oldBIOSLength := biosRegion.Length

          	workflowExecuteCLI(
          		t,
          		root,
          		"tighten_me",
          	)

          	if !biosRegion.Modified {
          		t.Fatal(
          			"tighten_me did not mark the BIOS region modified",
          		)
          	}

          	if meRegion.FRegion.Limit >= oldMELimit {
          		t.Fatalf(
          			"tighten_me did not reduce the ME region limit: old=%#x new=%#x",
          			oldMELimit,
          			meRegion.FRegion.Limit,
          		)
          	}

          	if biosRegion.FRegion.Base >= oldBIOSBase {
          		t.Fatalf(
          			"tighten_me did not lower the BIOS region base: old=%#x new=%#x",
          			oldBIOSBase,
          			biosRegion.FRegion.Base,
          		)
          	}

          	if biosRegion.Length <= oldBIOSLength {
          		t.Fatalf(
          			"tighten_me did not expand the BIOS region: old=%#x new=%#x",
          			oldBIOSLength,
          			biosRegion.Length,
          		)
          	}

          	if len(biosRegion.Elements) != 2 {
          		t.Fatalf(
          			"tighten_me produced %d BIOS elements; expected 2",
          			len(biosRegion.Elements),
          		)
          	}
          }

          func TestWorkflowCLIFlattenReadOnly(
          	t *testing.T,
          ) {
          	root := parseImage(t)
          	before := append(
          		[]byte(nil),
          		root.Buf()...,
          	)

          	matches := find(t, root, testGUID)
          	if len(matches) != 1 {
          		t.Fatalf(
          			"found %d test files; expected 1",
          			len(matches),
          		)
          	}

          	file, ok := matches[0].(*uefi.File)
          	if !ok {
          		t.Fatalf(
          			"matched object has type %T; expected *uefi.File",
          			matches[0],
          		)
          	}

          	sectionCount := len(file.Sections)

          	parsed := workflowParseCLI(
          		t,
          		"flatten",
          	)

          	if len(parsed) != 1 {
          		t.Fatalf(
          			"flatten produced %d visitors; expected 1",
          			len(parsed),
          		)
          	}

          	flatten, ok := parsed[0].(*Flatten)
          	if !ok {
          		t.Fatalf(
          			"flatten produced visitor type %T",
          			parsed[0],
          		)
          	}
          	flatten.W = io.Discard

          	if err := ExecuteCLI(root, parsed); err != nil {
          		t.Fatalf(
          			"flatten failed: %v",
          			err,
          		)
          	}

          	if len(flatten.List) == 0 {
          		t.Fatal(
          			"flatten produced an empty list",
          		)
          	}

          	if !bytes.Equal(before, root.Buf()) {
          		t.Fatal(
          			"flatten modified the root binary buffer",
          		)
          	}

          	if len(file.Sections) != sectionCount {
          		t.Fatalf(
          			"flatten changed the file section count from %d to %d",
          			sectionCount,
          			len(file.Sections),
          		)
          	}
          }
          GO

          gofmt -w \
            "$CANDIDATE_SOURCE/pkg/visitors/preserve_cli_workflow_test.go"

          cat > "$RESULTS/build/cli-mutation-coverage.txt" <<'EOF'
          CLI commands executed by preserve_cli_workflow_test.go
          =====================================================

          insert file
          insert pad_file
          replace_ffs
          insert_front
          insert_end
          insert_dxe
          insert_after
          insert_before
          remove
          remove_pad
          remove_dxes_except
          replace_pe32
          create-fv
          repack
          invalidate_nvar
          invalidate_nvar_except
          nvram-compact
          dxecleaner
          dxecleaner_blacklist
          tighten_me

          Read-only regression check
          ==========================

          flatten
          EOF

          test -s \
            "$CANDIDATE_SOURCE/pkg/visitors/preserve_cli_workflow_test.go"

      - name: Download Go dependencies
