          func TestWorkflowPreservationReplacePE32(
          	t *testing.T,
          ) {
          	pe32Path := filepath.Join(
          		t.TempDir(),
          		"replacement.bin",
          	)
          	if err := os.WriteFile(
          		pe32Path,
          		[]byte("MZworkflow"),
          		0o600,
          	); err != nil {
          		t.Fatal(err)
          	}

          	root := parseImage(t)

          	workflowRunCLI(
          		t,
          		root,
          		"replace_pe32",
          		testGUID.String(),
          		pe32Path,
          	)

          	state := workflowCollectModified(t, root)

          	if state.sections == 0 {
          		t.Fatal(
          			"replace_pe32 did not mark a section modified",
          		)
          	}

          	if !propagateModified(root) {
          		t.Fatal(
          			"replace_pe32 did not propagate its modification",
          		)
          	}

          	state = workflowCollectModified(t, root)

          	if state.files == 0 ||
          		state.firmwareVolumes == 0 {
          		t.Fatalf(
          			"replace_pe32 did not mark its ancestors: %+v",
          			state,
          		)
          	}
          }

          func TestWorkflowPreservationCreateFV(
          	t *testing.T,
          ) {
          	previousPolarity := uefi.Attributes.ErasePolarity
          	t.Cleanup(func() {
          		uefi.Attributes.ErasePolarity = previousPolarity
          	})

          	uefi.Attributes.ErasePolarity = 0xFF

          	buffer := make([]byte, 0x10000)
          	uefi.Erase(
          		buffer,
          		uefi.Attributes.ErasePolarity,
          	)

          	region, err := uefi.NewBIOSRegion(
          		buffer,
          		nil,
          		uefi.RegionTypeBIOS,
          	)
          	if err != nil {
          		t.Fatal(err)
          	}

          	biosRegion := region.(*uefi.BIOSRegion)

          	workflowRunCLI(
          		t,
          		biosRegion,
          		"create-fv",
          		"0x8000",
          		"0x1000",
          		"DECAFBAD-0000-0000-0000-000000000000",
          	)

          	if !biosRegion.Modified {
          		t.Fatal(
          			"create-fv did not mark the BIOS region modified",
          		)
          	}
          }

          func TestWorkflowPreservationRepack(
          	t *testing.T,
          ) {
          	fv, name := workflowRepackFixture(t)

          	workflowRunCLI(
          		t,
          		fv,
          		"repack",
          		name,
          	)

          	if !fv.Modified {
          		t.Fatal(
          			"repack did not mark the firmware volume modified",
          		)
          	}

          	if len(fv.Files) != 1 {
          		t.Fatalf(
          			"repack produced %d files; expected 1",
          			len(fv.Files),
          		)
          	}
          }

          func TestWorkflowPreservationNVRAMCommands(
          	t *testing.T,
          ) {
          	t.Run("invalidate_nvar", func(t *testing.T) {
          		root := workflowParseNVRAM(t)

          		workflowRunCLI(
          			t,
          			root,
          			"invalidate_nvar",
          			"Test0",
          		)

          		state := workflowCollectModified(
          			t,
          			root,
          		)

          		if state.nvars == 0 {
          			t.Fatal(
          				"invalidate_nvar did not mark an NVar modified",
          			)
          		}
          	})

          	t.Run(
          		"invalidate_nvar_except",
          		func(t *testing.T) {
          			whitelistPath := filepath.Join(
          				t.TempDir(),
          				"nvar-whitelist.txt",
          			)
          			if err := os.WriteFile(
          				whitelistPath,
          				[]byte("Test0\n"),
          				0o600,
          			); err != nil {
          				t.Fatal(err)
          			}

          			root := workflowParseNVRAM(t)

          			workflowRunCLI(
          				t,
          				root,
          				"invalidate_nvar_except",
          				whitelistPath,
          			)

          			state := workflowCollectModified(
          				t,
          				root,
          			)

          			if state.nvars == 0 {
          				t.Fatal(
          					"invalidate_nvar_except did not mark any NVar modified",
          				)
          			}
          		},
          	)

          	t.Run("nvram-compact", func(t *testing.T) {
          		root := workflowParseNVRAM(t)

          		workflowRunCLI(
          			t,
          			root,
          			"nvram-compact",
          		)

          		state := workflowCollectModified(
          			t,
          			root,
          		)

          		if state.nvarStores == 0 {
          			t.Fatal(
          				"nvram-compact did not mark an NVar store modified",
          			)
          		}
          	})
          }

          func TestWorkflowPreservationDXECleanerCommands(
          	t *testing.T,
          ) {
          	blacklistPath := filepath.Join(
          		t.TempDir(),
          		"empty-blacklist.txt",
          	)
          	if err := os.WriteFile(
          		blacklistPath,
          		nil,
          		0o600,
          	); err != nil {
          		t.Fatal(err)
          	}

          	tests := []struct {
          		name string
          		args []string
          	}{
          		{
          			name: "dxecleaner",
          			args: []string{
          				"dxecleaner",
          				"/bin/true",
          			},
          		},
          		{
          			name: "dxecleaner_blacklist",
          			args: []string{
          				"dxecleaner_blacklist",
          				"/bin/true",
          				blacklistPath,
          			},
          		},
          	}

          	for _, test := range tests {
          		t.Run(test.name, func(t *testing.T) {
          			root := parseImage(t)

          			parsed, err := ParseCLI(test.args)
          			if err != nil {
          				t.Fatalf(
          					"ParseCLI(%q) failed: %v",
          					test.args,
          					err,
          				)
          			}

          			if len(parsed) != 1 {
          				t.Fatalf(
          					"ParseCLI(%q) produced %d visitors",
          					test.args,
          					len(parsed),
          				)
          			}

          			cleaner, ok := parsed[0].(*DXECleaner)
          			if !ok {
          				t.Fatalf(
          					"%s produced visitor type %T",
          					test.name,
          					parsed[0],
          				)
          			}

          			cleaner.Test = func(
          				uefi.Firmware,
          			) (bool, error) {
          				return true, nil
          			}
          			cleaner.W = io.Discard

          			if err := cleaner.Run(root); err != nil {
          				t.Fatalf(
          					"%s failed: %v",
          					test.name,
          					err,
          				)
          			}

          			workflowRequireModifiedFV(
          				t,
          				root,
          				test.name,
          			)
          		})
          	}
          }

          func TestWorkflowPreservationTightenME(
          	t *testing.T,
          ) {
          	root, biosRegion := workflowTightenMEFixture(t)

          	workflowRunCLI(
          		t,
          		root,
          		"tighten_me",
          	)

          	if !biosRegion.Modified {
          		t.Fatal(
          			"tighten_me did not mark the BIOS region modified",
          		)
          	}

          	if biosRegion.FRegion.Base != 1 {
          		t.Fatalf(
          			"tighten_me set BIOS base to %#x; expected %#x",
          			biosRegion.FRegion.Base,
          			1,
          		)
          	}

          	if len(biosRegion.Elements) != 1 {
          		t.Fatalf(
          			"tighten_me produced %d BIOS elements; expected 1",
          			len(biosRegion.Elements),
          		)
          	}
          }

          func TestWorkflowFlattenDoesNotMutateTree(
          	t *testing.T,
          ) {
          	inner := &uefi.Section{}
          	section := &uefi.Section{
          		Encapsulated: []*uefi.TypedFirmware{
          			uefi.MakeTyped(inner),
          		},
          	}
          	file := &uefi.File{
          		Sections: []*uefi.Section{
          			section,
          		},
          	}
          	fv := &uefi.FirmwareVolume{
          		Files: []*uefi.File{
          			file,
          		},
          	}
          	biosRegion := &uefi.BIOSRegion{
          		Elements: []*uefi.TypedFirmware{
          			uefi.MakeTyped(fv),
          		},
          	}

          	parsed, err := ParseCLI(
          		[]string{"flatten"},
          	)
          	if err != nil {
          		t.Fatal(err)
          	}

          	if len(parsed) != 1 {
          		t.Fatalf(
          			"flatten produced %d visitors; expected 1",
          			len(parsed),
          		)
          	}

          	flatten, ok := parsed[0].(*Flatten)
          	if !ok {
          		t.Fatalf(
          			"flatten produced visitor type %T",
          			parsed[0],
          		)
          	}
          	flatten.W = io.Discard

          	if err := flatten.Run(biosRegion); err != nil {
          		t.Fatal(err)
          	}

          	if len(biosRegion.Elements) != 1 {
          		t.Fatal(
          			"flatten modified BIOSRegion.Elements",
          		)
          	}

          	if len(fv.Files) != 1 {
          		t.Fatal(
          			"flatten modified FirmwareVolume.Files",
          		)
          	}

          	if len(file.Sections) != 1 {
          		t.Fatal(
          			"flatten modified File.Sections",
          		)
          	}

          	if len(section.Encapsulated) != 1 {
          		t.Fatal(
          			"flatten modified Section.Encapsulated",
          		)
          	}
          }
          GO

