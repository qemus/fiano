                      writer.writeheader()
                      writer.writerows(
                          compression_rows
                      )

              roms = sorted(
                  OVMF_ROOT.glob(
                      "OVMF_CODE_4M*.fd"
                  )
              )

              for index, test_rom in enumerate(
                  roms,
                  start=1,
              ):
                  relative = str(
                      test_rom.relative_to(
