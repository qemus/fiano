                  ),
                  "regression": regression_rows,
                  "boot": boot_rows,
                  "manifest_changes": (
                      manifest_changes
                  ),
                  "failures": failures,
              }

              with (
                  RESULTS / "results.json"
              ).open("w") as handle:
                  json.dump(
                      result_data,
                      handle,
                      indent=2,
                  )

              if failures:
                  return 1

              return 0


          try:
              sys.exit(main())
          except Exception:
              error = traceback.format_exc()

              (
                  RESULTS / "fatal-error.txt"
              ).write_text(error)

              print(error, file=sys.stderr)
              raise
          PY

          python3 "$RUNNER_TEMP/compare.py"

      - name: Publish workflow summary
        if: always()
        run: |
          set -Eeuo pipefail

          mkdir -p "$RESULTS"

          if [[ -s "$RESULTS/report.md" ]]; then
            cat \
              "$RESULTS/report.md" \
              >> "$GITHUB_STEP_SUMMARY"

            cat "$RESULTS/report.md"
          else
            {
              echo "# Fiano ROM comparison"
              echo
              echo "The comparison stopped before the final report was generated."
              echo
              echo "Inspect the first failed step and the uploaded diagnostic files."
            } | tee \
              "$RESULTS/failure-summary.md" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "event=$GITHUB_EVENT_NAME"
            echo "ref=$GITHUB_REF"
            echo "sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
          } > "$RESULTS/workflow-context.txt"

      - name: Upload comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiano-rom-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/results
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
