                  candidate_mean = (
                      benchmark_summary[
                          operation
                      ]["lzma-preserve"]["mean"]
                  )

                  benchmark_summary[
                      operation
                  ]["preservation_speedup"] = (
                      baseline_mean
                      / candidate_mean
