                  slug = safe_name(relative)

                  find_result = run_utk(
                      CANDIDATE_BIN,
                      test_rom,
                      [
                          "find",
                          "LogoDXE",
                      ],
                      (
                          f"regression-{index}-"
                          f"{slug}-find"
