                              "candidate_noop_identical": "",
                              "replacement_outputs_equal": "",
                              "exact_qemu_ffs": "",
                          }
                      )
                      continue

                  regression_dir = (
                      TEMPORARY
                      / f"regression-{index}"
                  )
                  regression_dir.mkdir(
                      parents=True,
                      exist_ok=True,
                  )

                  baseline_output = (
                      regression_dir
                      / "lzma-only.fd"
                  )
                  candidate_output = (
                      regression_dir
                      / "lzma-preserve.fd"
                  )
                  candidate_noop = (
                      regression_dir
                      / "candidate-noop.fd"
                  )

                  run_utk(
                      CANDIDATE_BIN,
                      test_rom,
                      [
                          "save",
                          candidate_noop,
                      ],
                      (
                          f"regression-{index}-"
                          f"{slug}-noop"
                      ),
                  )

                  run_utk(
                      BASELINE_BIN,
                      test_rom,
                      [
                          "replace_ffs",
                          "LogoDXE",
                          QEMU_FFS,
                          "save",
                          baseline_output,
                      ],
                      (
                          f"regression-{index}-"
                          f"{slug}-baseline"
                      ),
                  )

                  run_utk(
                      CANDIDATE_BIN,
                      test_rom,
                      [
                          "replace_ffs",
                          "LogoDXE",
                          QEMU_FFS,
                          "save",
                          candidate_output,
                      ],
                      (
                          f"regression-{index}-"
                          f"{slug}-candidate"
                      ),
                  )

                  run_utk(
                      BASELINE_BIN,
                      baseline_output,
                      ["validate"],
                      (
                          f"regression-{index}-"
                          f"{slug}-baseline-validate"
                      ),
                  )

                  run_utk(
                      CANDIDATE_BIN,
                      candidate_output,
                      ["validate"],
                      (
                          f"regression-{index}-"
                          f"{slug}-candidate-validate"
                      ),
                  )

                  regression_extract = extract(
                      CANDIDATE_BIN,
                      candidate_output,
                      (
                          regression_dir
                          / "extracted"
                      ),
                      (
                          f"regression-{index}-"
                          f"{slug}-extract"
                      ),
                  )

                  noop_identical = (
                      sha256(test_rom)
                      == sha256(candidate_noop)
                  )
                  exact_replacement = bool(
                      find_hash(
                          regression_extract,
                          EXPECTED_QEMU_HASH,
                      )
                  )

                  require(
                      noop_identical,
                      (
                          f"{relative}: candidate "
                          "no-op is byte-identical"
                      ),
                  )

                  require(
                      exact_replacement,
                      (
                          f"{relative}: candidate "
                          "contains the exact "
                          "qemu.ffs"
                      ),
                  )

                  regression_rows.append(
                      {
                          "rom": relative,
                          "status": "tested",
                          "candidate_noop_identical": (
                              noop_identical
                          ),
                          "replacement_outputs_equal": (
                              sha256(baseline_output)
                              == sha256(
                                  candidate_output
                              )
                          ),
                          "exact_qemu_ffs": (
                              exact_replacement
                          ),
                      }
                  )

                  shutil.rmtree(
                      regression_dir,
                      ignore_errors=True,
