          // license that can be found in the LICENSE file.

          package visitors

          import (
          	"encoding/binary"
          	"io"
          	"os"
          	"path/filepath"
          	"testing"

          	"github.com/linuxboot/fiano/pkg/guid"
          	"github.com/linuxboot/fiano/pkg/uefi"
          )

          type workflowModifiedState struct {
          	biosRegions     int
          	firmwareVolumes int
          	files           int
          	sections        int
          	nvarStores      int
          	nvars           int
          }

          type workflowModifiedCollector struct {
          	state *workflowModifiedState
          }

          func (v *workflowModifiedCollector) Run(f uefi.Firmware) error {
          	return f.Apply(v)
          }

          func (v *workflowModifiedCollector) Visit(f uefi.Firmware) error {
          	switch f := f.(type) {
          	case *uefi.BIOSRegion:
          		if f.Modified {
          			v.state.biosRegions++
          		}

          	case *uefi.FirmwareVolume:
          		if f.Modified {
          			v.state.firmwareVolumes++
          		}

          	case *uefi.File:
          		if f.Modified {
          			v.state.files++
          		}

          	case *uefi.Section:
          		if f.Modified {
          			v.state.sections++
          		}

          	case *uefi.NVarStore:
          		if f.Modified {
          			v.state.nvarStores++
          		}

          	case *uefi.NVar:
          		if f.Modified {
          			v.state.nvars++
          		}
          	}

          	return f.ApplyChildren(v)
          }

          func workflowCollectModified(
          	t *testing.T,
          	root uefi.Firmware,
          ) workflowModifiedState {
          	t.Helper()

          	state := workflowModifiedState{}
          	collector := workflowModifiedCollector{
          		state: &state,
          	}

          	if err := collector.Run(root); err != nil {
          		t.Fatalf(
          			"collecting modified objects failed: %v",
          			err,
          		)
          	}

          	return state
          }

          func workflowRunCLI(
          	t *testing.T,
          	root uefi.Firmware,
          	args ...string,
          ) []uefi.Visitor {
          	t.Helper()

          	parsed, err := ParseCLI(args)
          	if err != nil {
          		t.Fatalf(
          			"ParseCLI(%q) failed: %v",
          			args,
          			err,
          		)
          	}

          	if err := ExecuteCLI(root, parsed); err != nil {
          		t.Fatalf(
          			"ExecuteCLI(%q) failed: %v",
          			args,
          			err,
          		)
          	}

          	return parsed
          }

          func workflowRequireModifiedFV(
          	t *testing.T,
          	root uefi.Firmware,
          	command string,
          ) {
          	t.Helper()

          	state := workflowCollectModified(t, root)

          	if state.firmwareVolumes == 0 {
          		t.Fatalf(
          			"%s did not mark a firmware volume modified",
          			command,
          		)
          	}

          	if !propagateModified(root) {
          		t.Fatalf(
          			"%s did not propagate its modification",
          			command,
          		)
          	}
          }

          func workflowParseNVRAM(
          	t *testing.T,
          ) uefi.Firmware {
          	t.Helper()

          	pd := ParseDir{
          		BasePath: "../../integration/roms/nvartest/",
          	}

          	root, err := pd.Parse()
          	if err != nil {
          		t.Fatalf(
          			"parsing NVRAM fixture failed: %v",
          			err,
          		)
          	}

          	assemble := Assemble{}
          	if err := assemble.Run(root); err != nil {
          		t.Fatalf(
          			"assembling NVRAM fixture failed: %v",
          			err,
          		)
          	}

          	return root
          }

          func workflowRepackFixture(
          	t *testing.T,
          ) (*uefi.FirmwareVolume, string) {
          	t.Helper()

          	rawSection, err := uefi.CreateSection(
          		uefi.SectionTypeRaw,
          		[]byte("workflow repack test"),
          		nil,
          		nil,
          	)
          	if err != nil {
          		t.Fatalf(
          			"creating repack section failed: %v",
          			err,
          		)
          	}

          	fileGUID := guid.MustParse(
          		"01234567-89AB-CDEF-0123-456789ABCDEF",
          	)
          	volumeGUID := guid.MustParse(
          		"89ABCDEF-0123-4567-89AB-CDEF01234567",
          	)

          	file := &uefi.File{
          		Parsed:   true,
          		Sections: []*uefi.Section{rawSection},
          	}
          	file.Header.GUID = *fileGUID
          	file.Header.Type = uefi.FVFileTypeDriver
          	file.Header.SetState(uefi.FileStateValid)

          	fv := &uefi.FirmwareVolume{
          		Parsed:         true,
          		FileSystemGUID: *uefi.FFS2,
          		FVName:         *volumeGUID,
          		Signature: binary.LittleEndian.Uint32(
          			[]byte("_FVH"),
          		),
          		Attributes: 0x0004FEFF,
          		Revision:   2,
          		Blocks: []uefi.Block{
          			{
          				Count: 1,
          				Size:  4096,
          			},
          		},
          		HeaderLen: 56,
          		Files:     []*uefi.File{file},
          	}

          	return fv, volumeGUID.String()
          }

          func workflowTightenMEFixture(
          	t *testing.T,
          ) (
          	*uefi.FlashImage,
          	*uefi.BIOSRegion,
          ) {
          	t.Helper()

          	previousPolarity := uefi.Attributes.ErasePolarity
          	t.Cleanup(func() {
          		uefi.Attributes.ErasePolarity = previousPolarity
          	})

          	uefi.Attributes.ErasePolarity = 0xFF

          	meRegionDescriptor := &uefi.FlashRegion{
          		Base:  0,
          		Limit: 1,
          	}
          	biosRegionDescriptor := &uefi.FlashRegion{
          		Base:  2,
          		Limit: 3,
          	}

          	meBuffer := make([]byte, 0x2000)
          	uefi.Erase(
          		meBuffer,
          		uefi.Attributes.ErasePolarity,
          	)

          	meRegion := &uefi.MERegion{
          		FRegion:         meRegionDescriptor,
          		RegionType:      uefi.RegionTypeME,
          		FreeSpaceOffset: 0x1000,
          	}
          	meRegion.SetBuf(meBuffer)

          	biosRegion := &uefi.BIOSRegion{
          		FRegion:    biosRegionDescriptor,
          		RegionType: uefi.RegionTypeBIOS,
          		Length:     0x2000,
          		Parsed:     true,
          	}

          	root := &uefi.FlashImage{
          		FlashSize: 0x4000,
          		Regions: []*uefi.TypedFirmware{
          			uefi.MakeTyped(meRegion),
          			uefi.MakeTyped(biosRegion),
          		},
          	}

          	return root, biosRegion
          }

          func TestWorkflowPreservationInsertCommands(
          	t *testing.T,
          ) {
          	tests := []struct {
          		name string
          		args []string
          	}{
          		{
          			name: "insert",
          			args: []string{
          				"insert",
          				"file",
          				insertTestFile,
          				"after",
          				testGUID.String(),
          			},
          		},
          		{
          			name: "insert_pad_file",
          			args: []string{
          				"insert",
          				"pad_file",
          				"256",
          				"before",
          				testGUID.String(),
          			},
          		},
          		{
          			name: "replace_ffs",
          			args: []string{
          				"replace_ffs",
          				testGUID.String(),
          				insertTestFile,
          			},
          		},
          		{
          			name: "insert_front",
          			args: []string{
          				"insert_front",
          				testGUID.String(),
          				insertTestFile,
          			},
          		},
          		{
          			name: "insert_end",
          			args: []string{
          				"insert_end",
          				testGUID.String(),
          				insertTestFile,
          			},
          		},
          		{
          			name: "insert_dxe",
          			args: []string{
          				"insert_dxe",
          				insertTestFile,
          			},
          		},
          		{
          			name: "insert_after",
          			args: []string{
          				"insert_after",
          				testGUID.String(),
          				insertTestFile,
          			},
          		},
          		{
          			name: "insert_before",
          			args: []string{
          				"insert_before",
          				testGUID.String(),
          				insertTestFile,
          			},
          		},
          	}

          	for _, test := range tests {
          		t.Run(test.name, func(t *testing.T) {
          			root := parseImage(t)

          			workflowRunCLI(
          				t,
          				root,
          				test.args...,
          			)

          			workflowRequireModifiedFV(
          				t,
          				root,
          				test.name,
          			)
          		})
          	}
          }

