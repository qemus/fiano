                                  ),
                                  "candidate_changed_bytes": (
                                      candidate_stats[
                                          "changed_bytes"
                                      ]
                                  ),
                                  "exact_qemu_ffs": (
                                      exact_replacement
                                  ),
                              }
                          )

                          shutil.rmtree(
                              candidate_matrix_extract,
                              ignore_errors=True,
                          )

                          for output in (
                              matrix_outputs.values()
                          ):
                              output.unlink()

                  with (
                      RESULTS
                      / "compression-matrix.csv"
                  ).open(
                      "w",
                      newline="",
                  ) as handle:
                      writer = csv.DictWriter(
                          handle,
                          fieldnames=list(
                              compression_rows[0]
