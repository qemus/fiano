                      ]

                      wall_values = [
                          row["wall_seconds"]
                          for row in rows
                      ]

                      unique_hashes = {
                          row["output_sha256"]
                          for row in rows
                      }

                      benchmark_summary[
                          operation
                      ][name] = {
                          "runs": len(rows),
                          "mean": statistics.mean(
                              wall_values
                          ),
                          "median": (
                              statistics.median(
                                  wall_values
                              )
                          ),
                          "stdev": (
                              statistics.stdev(
                                  wall_values
                              )
                              if len(wall_values) > 1
                              else 0.0
                          ),
                          "minimum": min(
                              wall_values
                          ),
                          "maximum": max(
                              wall_values
                          ),
                          "unique_hashes": len(
                              unique_hashes
                          ),
                      }

                      require(
                          len(unique_hashes) == 1,
                          (
                              f"{name} {operation} "
