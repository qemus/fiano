      - name: Build UTK variants and exact FFS verifier
        run: |
          set -Eeuo pipefail

          build_variant() {
            local name="$1"
            local source="$2"
            local output="$3"

            (
              cd "$source/cmds/utk"

              /usr/bin/time \
                --output="$RESULTS/build/${name}.time" \
                --format=$'wall_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_rss_kb=%M' \
                env \
                  CGO_ENABLED=0 \
                  GOOS=linux \
                  GOARCH=amd64 \
                  GOTOOLCHAIN=local \
                  go build \
                    -a \
                    -trimpath \
                    -installsuffix cgo \
                    -o "$output" \
                    .
            )
          }

          go version \
            | tee "$RESULTS/build/go-version.txt"

          build_variant \
            "lzma-only" \
            "$BASELINE_SOURCE" \
            "$BASELINE_BIN"

          build_variant \
            "lzma-preserve" \
            "$CANDIDATE_SOURCE" \
            "$CANDIDATE_BIN"

          VERIFY_SOURCE="$CANDIDATE_SOURCE/cmds/verify-ffs"

          mkdir -p "$VERIFY_SOURCE"

          cat > "$VERIFY_SOURCE/main.go" <<'GO'
          package main

          import (
          	"bytes"
          	"crypto/sha256"
          	"fmt"
          	"os"

          	"github.com/linuxboot/fiano/pkg/uefi"
          	"github.com/linuxboot/fiano/pkg/visitors"
          )

          func fatalf(format string, args ...interface{}) {
          	fmt.Fprintf(os.Stderr, format+"\n", args...)
          	os.Exit(1)
          }

          func main() {
          	if len(os.Args) != 3 {
          		fmt.Fprintf(
          			os.Stderr,
          			"usage: %s EXPECTED_FFS FIRMWARE\n",
          			os.Args[0],
          		)
          		os.Exit(2)
          	}

          	expectedPath := os.Args[1]
          	firmwarePath := os.Args[2]

          	expectedData, err := os.ReadFile(expectedPath)
          	if err != nil {
          		fatalf("read expected FFS: %v", err)
          	}

          	expected, err := uefi.NewFile(expectedData)
          	if err != nil {
          		fatalf("parse expected FFS: %v", err)
          	}
          	if expected == nil {
          		fatalf("expected FFS parsed as free space")
          	}

          	firmwareData, err := os.ReadFile(firmwarePath)
          	if err != nil {
          		fatalf("read firmware: %v", err)
          	}

          	root, err := uefi.Parse(firmwareData)
          	if err != nil {
          		fatalf("parse firmware: %v", err)
          	}

          	match, err := visitors.FindExactlyOne(
          		root,
          		visitors.FindFileGUIDPredicate(
          			expected.Header.GUID,
          		),
          	)
          	if err != nil {
          		fatalf("find replacement FFS: %v", err)
          	}

          	actual, ok := match.(*uefi.File)
          	if !ok {
          		fatalf(
          			"matched object has type %T, expected *uefi.File",
          			match,
          		)
          	}

          	if !bytes.Equal(actual.Buf(), expectedData) {
          		expectedHash := sha256.Sum256(expectedData)
          		actualHash := sha256.Sum256(actual.Buf())

          		fatalf(
          			"FFS differs: expected size=%d sha256=%x, actual size=%d sha256=%x",
          			len(expectedData),
          			expectedHash,
          			len(actual.Buf()),
          			actualHash,
          		)
          	}

          	hash := sha256.Sum256(actual.Buf())

          	fmt.Printf(
          		"exact FFS match: guid=%s size=%d sha256=%x\n",
          		actual.Header.GUID.String(),
          		len(actual.Buf()),
          		hash,
          	)
          }
          GO

          (
            cd "$CANDIDATE_SOURCE"

            env \
              CGO_ENABLED=0 \
              GOOS=linux \
              GOARCH=amd64 \
              GOTOOLCHAIN=local \
              go build \
                -trimpath \
                -o "$VERIFY_FFS_BIN" \
                ./cmds/verify-ffs
          )

          chmod +x \
            "$BASELINE_BIN" \
            "$CANDIDATE_BIN" \
            "$VERIFY_FFS_BIN"

          {
            echo "## Binary hashes"

            sha256sum \
              "$BASELINE_BIN" \
              "$CANDIDATE_BIN" \
              "$VERIFY_FFS_BIN"

            echo
            echo "## Binary sizes"

            stat \
              --printf='%n %s bytes\n' \
              "$BASELINE_BIN" \
              "$CANDIDATE_BIN" \
              "$VERIFY_FFS_BIN"
          } | tee "$RESULTS/build/binaries.txt"

      - name: Download exact ROM test assets
        run: |
          set -Eeuo pipefail

          ASSET_DIR="$RESULTS/assets"
          OVMF_DIR="$RUNNER_TEMP/ovmf"

          mkdir -p \
            "$ASSET_DIR" \
            "$OVMF_DIR"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --output "$ASSET_DIR/qemu.ffs" \
            "https://raw.githubusercontent.com/qemus/qemu/1ba2415801c647e7c9ee3ce9bf8a3de398832775/web/img/qemu.ffs"

          echo \
            "270198104fc084a83f721283e98f7c930ea5f3e83489e98117d546e2a7d29842  $ASSET_DIR/qemu.ffs" \
            | sha256sum --check -

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --output "$ASSET_DIR/ovmf-generic_2025.11-5_all.deb" \
            "https://deb.debian.org/debian/pool/main/e/edk2/ovmf-generic_2025.11-5_all.deb"

          dpkg-deb \
            --extract \
            "$ASSET_DIR/ovmf-generic_2025.11-5_all.deb" \
            "$OVMF_DIR"

          ROM="$(
            find \
              "$OVMF_DIR" \
              -type f \
              -name 'OVMF_CODE_4M.fd' \
              -print \
              -quit
          )"

          VARS="$(
            find \
              "$OVMF_DIR" \
              -type f \
              -name 'OVMF_VARS_4M.fd' \
              -print \
              -quit
          )"

          if [[ -z "$ROM" || ! -s "$ROM" ]]; then
            echo "OVMF_CODE_4M.fd was not found." >&2
            exit 1
          fi

          if [[ -z "$VARS" || ! -s "$VARS" ]]; then
            echo "OVMF_VARS_4M.fd was not found." >&2
            exit 1
          fi

          echo \
            "0082274a5b06d3b27e34972f2ec6915784033d41dd3c946bd807f0ac6525e699  $ROM" \
            | sha256sum --check -

          OVMF_ROOT="$(dirname "$ROM")"

          cp \
            "$ROM" \
            "$ASSET_DIR/OVMF_CODE_4M.fd"

          cp \
            "$VARS" \
            "$ASSET_DIR/OVMF_VARS_4M.fd"

          {
            echo "ROM=$ROM"
            echo "VARS=$VARS"
            echo "OVMF_ROOT=$OVMF_ROOT"
            echo "QEMU_FFS=$ASSET_DIR/qemu.ffs"
          } >> "$GITHUB_ENV"

          {
            sha256sum \
              "$ASSET_DIR/OVMF_CODE_4M.fd" \
              "$ASSET_DIR/OVMF_VARS_4M.fd" \
              "$ASSET_DIR/qemu.ffs"

            echo

            stat \
              --printf='%n %s bytes\n' \
              "$ASSET_DIR/OVMF_CODE_4M.fd" \
              "$ASSET_DIR/OVMF_VARS_4M.fd" \
              "$ASSET_DIR/qemu.ffs"
          } | tee "$ASSET_DIR/assets.txt"

      - name: Run primary ROM comparison
        run: |
          set -Eeuo pipefail

          OUTPUT_DIR="$RESULTS/outputs/primary"

          mkdir -p "$OUTPUT_DIR"

          BASELINE_NOOP="$OUTPUT_DIR/lzma-only-noop.fd"
          CANDIDATE_NOOP="$OUTPUT_DIR/lzma-preserve-noop.fd"
          BASELINE_REPLACE="$OUTPUT_DIR/lzma-only-replace.fd"
          CANDIDATE_REPLACE="$OUTPUT_DIR/lzma-preserve-replace.fd"
          CANDIDATE_RESAVE="$OUTPUT_DIR/lzma-preserve-resave.fd"

          "$BASELINE_BIN" \
            -lzma-level="$LZMA_LEVEL" \
            "$ROM" \
            save \
            "$BASELINE_NOOP"

          "$CANDIDATE_BIN" \
            -lzma-level="$LZMA_LEVEL" \
            "$ROM" \
            save \
            "$CANDIDATE_NOOP"

          cmp \
            "$ROM" \
            "$CANDIDATE_NOOP"

          "$BASELINE_BIN" \
            -lzma-level="$LZMA_LEVEL" \
            "$ROM" \
            replace_ffs \
            LogoDXE \
            "$QEMU_FFS" \
            save \
            "$BASELINE_REPLACE"

          "$CANDIDATE_BIN" \
            -lzma-level="$LZMA_LEVEL" \
            "$ROM" \
            replace_ffs \
            LogoDXE \
            "$QEMU_FFS" \
            save \
            "$CANDIDATE_REPLACE"

          cmp \
            "$BASELINE_REPLACE" \
            "$CANDIDATE_REPLACE"

          "$BASELINE_BIN" \
            "$BASELINE_NOOP" \
            validate

          "$CANDIDATE_BIN" \
            "$CANDIDATE_NOOP" \
            validate

          "$BASELINE_BIN" \
            "$BASELINE_REPLACE" \
            validate

          "$CANDIDATE_BIN" \
            "$CANDIDATE_REPLACE" \
            validate

          "$VERIFY_FFS_BIN" \
            "$QEMU_FFS" \
            "$BASELINE_REPLACE"

          "$VERIFY_FFS_BIN" \
            "$QEMU_FFS" \
            "$CANDIDATE_REPLACE"

          "$CANDIDATE_BIN" \
            "$CANDIDATE_REPLACE" \
            save \
            "$CANDIDATE_RESAVE"

          cmp \
            "$CANDIDATE_REPLACE" \
            "$CANDIDATE_RESAVE"

          {
            echo "original=$(sha256sum "$ROM")"
            echo "lzma_only_noop=$(sha256sum "$BASELINE_NOOP")"
            echo "preserve_noop=$(sha256sum "$CANDIDATE_NOOP")"
            echo "lzma_only_replace=$(sha256sum "$BASELINE_REPLACE")"
            echo "preserve_replace=$(sha256sum "$CANDIDATE_REPLACE")"
            echo "preserve_resave=$(sha256sum "$CANDIDATE_RESAVE")"
          } | tee "$RESULTS/primary-comparison.txt"

          {
            echo "BASELINE_REPLACE=$BASELINE_REPLACE"
            echo "CANDIDATE_REPLACE=$CANDIDATE_REPLACE"
          } >> "$GITHUB_ENV"

      - name: Run deterministic output checks
        run: |
          set -Eeuo pipefail

          OUTPUT_DIR="$RESULTS/outputs/determinism"

          mkdir -p "$OUTPUT_DIR"

          check_variant() {
            local name="$1"
            local binary="$2"
            local reference=""

            for run in 1 2 3 4 5; do
              local output="$OUTPUT_DIR/${name}-${run}.fd"

              "$binary" \
                -lzma-level="$LZMA_LEVEL" \
                "$ROM" \
                replace_ffs \
                LogoDXE \
                "$QEMU_FFS" \
                save \
                "$output"

              "$VERIFY_FFS_BIN" \
                "$QEMU_FFS" \
                "$output"

              if [[ -z "$reference" ]]; then
                reference="$output"
              else
                cmp \
                  "$reference" \
                  "$output"
              fi
            done
          }

          check_variant \
            "lzma-only" \
            "$BASELINE_BIN"

          check_variant \
            "lzma-preserve" \
            "$CANDIDATE_BIN"

          sha256sum \
            "$OUTPUT_DIR"/*.fd \
            | tee "$RESULTS/determinism.txt"

      - name: Run compression matrix
        if: env.RUN_MATRIX == 'true'
        run: |
          set -Eeuo pipefail

          OUTPUT_DIR="$RESULTS/outputs/compression-matrix"

          mkdir -p "$OUTPUT_DIR"

          {
            echo "backend,level,sha256"
          } > "$RESULTS/compression-matrix.csv"

          for backend in system internal; do
            for level in {0..9}; do
              args=(
                "-lzma-level=$level"
              )

              if [[ "$backend" == "internal" ]]; then
                args+=("-xzPath=")
              fi

              baseline="$OUTPUT_DIR/lzma-only-${backend}-${level}.fd"
              candidate="$OUTPUT_DIR/lzma-preserve-${backend}-${level}.fd"

              "$BASELINE_BIN" \
                "${args[@]}" \
                "$ROM" \
                replace_ffs \
                LogoDXE \
                "$QEMU_FFS" \
                save \
                "$baseline"

              "$CANDIDATE_BIN" \
                "${args[@]}" \
                "$ROM" \
                replace_ffs \
                LogoDXE \
                "$QEMU_FFS" \
                save \
                "$candidate"

              "$BASELINE_BIN" \
                "$baseline" \
                validate

              "$CANDIDATE_BIN" \
                "$candidate" \
                validate

              cmp \
                "$baseline" \
                "$candidate"

              "$VERIFY_FFS_BIN" \
                "$QEMU_FFS" \
                "$baseline"

              "$VERIFY_FFS_BIN" \
                "$QEMU_FFS" \
                "$candidate"

              printf '%s,%s,%s\n' \
                "$backend" \
                "$level" \
                "$(sha256sum "$candidate" | awk '{print $1}')" \
                >> "$RESULTS/compression-matrix.csv"
            done
          done

      - name: Run OVMF regression matrix
        run: |
          set -Eeuo pipefail

          OUTPUT_DIR="$RESULTS/outputs/ovmf-regression"

          mkdir -p "$OUTPUT_DIR"

          {
            echo "rom,noop_sha256,replacement_sha256"
          } > "$RESULTS/ovmf-regression.csv"

          found=0

          while IFS= read -r test_rom; do
            found=1

            name="$(basename "$test_rom")"
            slug="${name//[^A-Za-z0-9_.-]/-}"

            candidate_noop="$OUTPUT_DIR/${slug}-noop.fd"
            baseline_replace="$OUTPUT_DIR/${slug}-baseline.fd"
            candidate_replace="$OUTPUT_DIR/${slug}-candidate.fd"

            "$CANDIDATE_BIN" \
              -lzma-level="$LZMA_LEVEL" \
              "$test_rom" \
              save \
              "$candidate_noop"

            cmp \
              "$test_rom" \
              "$candidate_noop"

            "$BASELINE_BIN" \
              -lzma-level="$LZMA_LEVEL" \
              "$test_rom" \
              replace_ffs \
              LogoDXE \
              "$QEMU_FFS" \
              save \
              "$baseline_replace"

            "$CANDIDATE_BIN" \
              -lzma-level="$LZMA_LEVEL" \
              "$test_rom" \
              replace_ffs \
              LogoDXE \
              "$QEMU_FFS" \
              save \
              "$candidate_replace"

            cmp \
              "$baseline_replace" \
              "$candidate_replace"

            "$BASELINE_BIN" \
              "$baseline_replace" \
              validate

            "$CANDIDATE_BIN" \
              "$candidate_replace" \
              validate

            "$VERIFY_FFS_BIN" \
              "$QEMU_FFS" \
              "$baseline_replace"

            "$VERIFY_FFS_BIN" \
              "$QEMU_FFS" \
              "$candidate_replace"

            printf '%s,%s,%s\n' \
              "$name" \
              "$(sha256sum "$candidate_noop" | awk '{print $1}')" \
              "$(sha256sum "$candidate_replace" | awk '{print $1}')" \
              >> "$RESULTS/ovmf-regression.csv"
          done < <(
            find \
              "$OVMF_ROOT" \
              -maxdepth 1 \
              -type f \
              -name 'OVMF_CODE_4M*.fd' \
              -print \
              | sort
          )

          if (( found == 0 )); then
            echo "No OVMF_CODE_4M*.fd files were found." >&2
            exit 1
          fi

      - name: Run runtime benchmarks
        run: |
          set -Eeuo pipefail

          OUTPUT_DIR="$RUNNER_TEMP/fiano-benchmarks"

          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

          benchmark() {
            local variant="$1"
            local binary="$2"
            local operation="$3"
            local times="$RESULTS/benchmark/${variant}-${operation}.txt"

            : > "$times"

            for run in $(seq 1 "$RUNS"); do
              output="$OUTPUT_DIR/${variant}-${operation}-${run}.fd"

              if [[ "$operation" == "noop" ]]; then
                command=(
                  "$binary"
                  "-lzma-level=$LZMA_LEVEL"
                  "$ROM"
                  save
                  "$output"
                )
              else
                command=(
                  "$binary"
                  "-lzma-level=$LZMA_LEVEL"
                  "$ROM"
                  replace_ffs
                  LogoDXE
                  "$QEMU_FFS"
                  save
                  "$output"
                )
              fi

              /usr/bin/time \
                --quiet \
                --format='%e' \
                --output="$times" \
                --append \
                "${command[@]}"

              rm -f "$output"
            done

            awk \
              -v variant="$variant" \
              -v operation="$operation" \
              '
                {
                  total += $1
                  count++
                }
                END {
                  if (count == 0) {
                    exit 1
                  }

                  printf "%s,%s,%d,%.6f\n",
                    variant,
                    operation,
                    count,
                    total / count
                }
              ' \
              "$times"
          }

          {
            echo "variant,operation,runs,mean_seconds"

            benchmark \
              "lzma-only" \
              "$BASELINE_BIN" \
              "noop"

            benchmark \
              "lzma-preserve" \
              "$CANDIDATE_BIN" \
              "noop"

            benchmark \
              "lzma-only" \
              "$BASELINE_BIN" \
              "replace"

            benchmark \
              "lzma-preserve" \
              "$CANDIDATE_BIN" \
              "replace"
          } | tee "$RESULTS/benchmark.csv"

      - name: Run QEMU boot smoke tests
        if: env.RUN_BOOT_TEST == 'true'
        run: |
          set -Eeuo pipefail

          boot_test() {
            local name="$1"
            local firmware="$2"
            local vars_copy="$RUNNER_TEMP/${name}-vars.fd"
            local log="$RESULTS/logs/boot-${name}.log"

            cp \
              "$VARS" \
              "$vars_copy"

            set +e

            timeout \
              12s \
              qemu-system-x86_64 \
                -machine q35,accel=tcg \
                -cpu max \
                -m 256M \
                -nodefaults \
                -drive "if=pflash,unit=0,format=raw,readonly=on,file=$firmware" \
                -drive "if=pflash,unit=1,format=raw,file=$vars_copy" \
                -display none \
                -serial none \
                -monitor none \
                -no-reboot \
                -no-shutdown \
                > "$log" \
                2>&1

            rc=$?

            set -e

            echo "$name exit code: $rc"

            if (( rc != 124 )); then
              echo "$name exited before the 12-second timeout." >&2
              cat "$log" >&2
              return 1
            fi
          }

          boot_test \
            "lzma-only" \
            "$BASELINE_REPLACE"

          boot_test \
            "lzma-preserve" \
            "$CANDIDATE_REPLACE"

      - name: Publish workflow summary
        if: always()
        run: |
          set -Eeuo pipefail

          {
            echo "# Fiano ROM comparison"
            echo

            if [[ -s "$RESULTS/primary-comparison.txt" ]]; then
              echo "## Primary comparison"
              echo
              echo '```text'
              cat "$RESULTS/primary-comparison.txt"
              echo '```'
              echo
            fi

            if [[ -s "$RESULTS/build/cli-mutation-coverage.txt" ]]; then
              echo "## CLI mutation coverage"
              echo
              echo '```text'
              cat "$RESULTS/build/cli-mutation-coverage.txt"
              echo '```'
              echo
            fi

            if [[ -s "$RESULTS/benchmark.csv" ]]; then
              echo "## Runtime benchmark"
              echo
              echo '```csv'
              cat "$RESULTS/benchmark.csv"
              echo '```'
              echo
            fi

            if [[ -s "$RESULTS/compression-matrix.csv" ]]; then
              echo "## Compression matrix"
              echo
              echo '```csv'
              cat "$RESULTS/compression-matrix.csv"
              echo '```'
              echo
            fi

            if [[ -s "$RESULTS/ovmf-regression.csv" ]]; then
              echo "## OVMF regression matrix"
              echo
              echo '```csv'
              cat "$RESULTS/ovmf-regression.csv"
              echo '```'
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "event=$GITHUB_EVENT_NAME"
            echo "ref=$GITHUB_REF"
            echo "sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
          } > "$RESULTS/workflow-context.txt"

      - name: Upload comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiano-rom-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/results
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
