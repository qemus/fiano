              with (
                  RESULTS
                  / "rom-regression.csv"
              ).open(
                  "w",
                  newline="",
              ) as handle:
                  writer = csv.DictWriter(
                      handle,
                      fieldnames=list(
                          regression_rows[0]
                      ),
                  )
                  writer.writeheader()
                  writer.writerows(
                      regression_rows
                  )

              if RUN_BOOT_TEST:
                  for name in variants:
                      firmware = (
                          exact_outputs[
                              name
                          ]["replace"]
                      )
                      vars_copy = (
                          TEMPORARY
                          / f"{name}.vars.fd"
                      )
                      shutil.copy2(
                          VARS,
                          vars_copy,
                      )

                      log_path = (
                          LOGS
                          / f"boot-{name}.log"
                      )

                      command = [
                          "timeout",
                          "12s",
                          "qemu-system-x86_64",
                          "-machine",
                          "q35,accel=tcg",
                          "-cpu",
                          "max",
                          "-m",
                          "256M",
                          "-nodefaults",
                          "-drive",
                          (
                              "if=pflash,unit=0,"
                              "format=raw,"
                              "readonly=on,"
                              f"file={firmware}"
                          ),
                          "-drive",
                          (
                              "if=pflash,unit=1,"
                              "format=raw,"
                              f"file={vars_copy}"
                          ),
                          "-display",
                          "none",
                          "-serial",
                          "none",
                          "-monitor",
                          "none",
                          "-no-reboot",
                          "-no-shutdown",
                      ]

                      with log_path.open(
                          "wb"
                      ) as log:
                          process = (
                              subprocess.run(
                                  command,
                                  stdout=log,
                                  stderr=(
                                      subprocess.STDOUT
                                  ),
                                  check=False,
                              )
                          )

                      stayed_running = (
                          process.returncode
                          == 124
                      )

                      require(
                          stayed_running,
                          (
                              f"{name} ROM remains "
                              "running under QEMU TCG "
                              "for 12 seconds"
                          ),
                      )

                      boot_rows.append(
                          {
                              "variant": name,
                              "return_code": (
                                  process.returncode
                              ),
                              "stayed_running": (
                                  stayed_running
                              ),
                          }
                      )

              report = [
                  "# Fiano ROM comparison",
                  "",
                  (
                      f"- Fiano version: "
                      f"**{os.environ['FIANO_VERSION']}**"
                  ),
                  (
                      f"- Go version: "
                      f"**{os.environ['GO_VERSION']}**"
                  ),
                  (
                      f"- Benchmark runs: "
                      f"**{RUNS}**"
                  ),
                  (
                      f"- Primary LZMA level: "
                      f"**{LZMA_LEVEL}**"
                  ),
                  (
                      "- Compression matrix: "
                      f"**{'enabled' if RUN_MATRIX else 'disabled'}**"
                  ),
                  (
                      "- QEMU boot test: "
                      f"**{'enabled' if RUN_BOOT_TEST else 'disabled'}**"
                  ),
                  "",
                  "## Exact byte comparisons",
                  "",
                  (
                      "| Comparison | Equal | "
                      "Changed bytes | Changed % | "
                      "Ranges | First | Last |"
                  ),
                  (
                      "|---|---:|---:|---:|"
                      "---:|---:|---:|"
                  ),
              ]

              for name, stats in (
                  comparisons.items()
              ):
                  report.append(
                      "| "
                      + " | ".join(
                          [
                              name,
                              (
                                  "yes"
                                  if stats["equal"]
                                  else "no"
                              ),
                              (
                                  f"{stats['changed_bytes']:,}"
                              ),
                              (
                                  f"{stats['changed_percent']:.6f}"
                              ),
                              (
                                  f"{stats['range_count']:,}"
                              ),
                              (
                                  stats[
                                      "first_difference"
                                  ]
                                  or "-"
                              ),
                              (
                                  stats[
                                      "last_difference"
                                  ]
                                  or "-"
                              ),
                          ]
                      )
                      + " |"
                  )

              report.extend(
                  [
                      "",
                      (
                          "## Extracted firmware "
                          "comparison"
                      ),
                      "",
                      (
                          "- LZMA-only qemu.ffs "
                          f"matches: `{', '.join(baseline_matches) or 'none'}`"
                      ),
                      (
                          "- Preservation qemu.ffs "
                          f"matches: `{', '.join(candidate_matches) or 'none'}`"
                      ),
                      (
                          "- Logical paths differing "
                          "between both replacement "
                          "extractions: "
                          f"`{len(manifest_changes['lzma-only-vs-preserve'])}`"
                      ),
                      "",
                      "## Runtime benchmark",
                      "",
                      (
                          "| Operation | Variant | "
                          "Mean | Median | Stddev | "
                          "Minimum | Maximum |"
                      ),
                      (
                          "|---|---|---:|---:|"
                          "---:|---:|---:|"
                      ),
                  ]
              )

              for operation in (
                  "noop",
                  "replace",
              ):
                  for name in variants:
                      stats = (
                          benchmark_summary[
                              operation
                          ][name]
                      )

                      report.append(
                          "| "
                          + " | ".join(
                              [
                                  operation,
                                  name,
                                  (
                                      f"{stats['mean']:.6f}s"
                                  ),
                                  (
                                      f"{stats['median']:.6f}s"
                                  ),
                                  (
                                      f"{stats['stdev']:.6f}s"
                                  ),
                                  (
                                      f"{stats['minimum']:.6f}s"
                                  ),
                                  (
                                      f"{stats['maximum']:.6f}s"
                                  ),
                              ]
                          )
                          + " |"
                      )

                  speedup = (
                      benchmark_summary[
                          operation
                      ][
                          "preservation_speedup"
                      ]
                  )

                  report.extend(
                      [
                          "",
                          (
                              "Preservation-build "
                              f"`{operation}` speedup: "
                              f"**{speedup:.3f}x**"
                          ),
                          "",
                      ]
                  )

              if compression_rows:
                  report.extend(
                      [
                          "## Compression matrix",
                          "",
                          (
                              "| Backend | Level | "
                              "Outputs equal | "
                              "LZMA-only changed | "
                              "Preservation changed | "
