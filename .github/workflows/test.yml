                          ),
                          (
                              "|---|---:|---:|---:|"
                              "---:|---:|"
                          ),
                      ]
                  )

                  for row in compression_rows:
                      report.append(
                          "| "
                          + " | ".join(
                              [
                                  row["backend"],
                                  str(row["level"]),
                                  (
                                      "yes"
                                      if row[
                                          "outputs_equal"
                                      ]
                                      else "no"
                                  ),
                                  (
                                      f"{row['baseline_changed_bytes']:,}"
                                  ),
                                  (
                                      f"{row['candidate_changed_bytes']:,}"
                                  ),
                                  (
                                      "yes"
                                      if row[
                                          "exact_qemu_ffs"
                                      ]
                                      else "no"
                                  ),
                              ]
                          )
                          + " |"
                      )

                  report.append("")

              report.extend(
                  [
                      "## OVMF regression matrix",
                      "",
                      (
                          "| ROM | Status | "
                          "Candidate no-op identical | "
                          "Replacement outputs equal | "
                          "Exact qemu.ffs |"
                      ),
                      "|---|---|---:|---:|---:|",
                  ]
              )

              for row in regression_rows:
                  report.append(
                      "| "
                      + " | ".join(
                          [
                              row["rom"],
                              row["status"],
                              str(
                                  row[
                                      "candidate_noop_identical"
                                  ]
                              ),
                              str(
                                  row[
                                      "replacement_outputs_equal"
                                  ]
                              ),
                              str(
                                  row[
                                      "exact_qemu_ffs"
                                  ]
                              ),
                          ]
                      )
                      + " |"
                  )

              report.append("")

              if boot_rows:
                  report.extend(
                      [
                          "## QEMU boot smoke test",
                          "",
                          (
                              "| Variant | Exit code | "
