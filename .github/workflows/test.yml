          func workflowRunDXECleaner(
          	t *testing.T,
          	args ...string,
          ) {
          	t.Helper()

          	root := parseImage(t)
          	before := append(
          		[]byte(nil),
          		root.Buf()...,
          	)

          	parsed := workflowParseCLI(t, args...)
          	if len(parsed) != 1 {
          		t.Fatalf(
          			"ParseCLI(%q) produced %d visitors; expected 1",
          			args,
          			len(parsed),
          		)
          	}

          	cleaner, ok := parsed[0].(*DXECleaner)
          	if !ok {
          		t.Fatalf(
          			"ParseCLI(%q) produced visitor type %T",
          			args,
          			parsed[0],
          		)
          	}

          	cleaner.Test = func(
          		uefi.Firmware,
          	) (bool, error) {
          		return true, nil
          	}
          	cleaner.W = io.Discard

          	if err := ExecuteCLI(root, parsed); err != nil {
          		t.Fatalf(
          			"ExecuteCLI(%q) failed: %v",
          			args,
          			err,
          		)
          	}

          	if len(cleaner.Removals) == 0 {
          		t.Fatalf(
          			"%s did not remove any DXE files",
          			args[0],
          		)
          	}

          	workflowVerifyMutation(
          		t,
          		root,
          		before,
          		true,
          		args[0],
          	)
          }

